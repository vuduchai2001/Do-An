<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hexgate logo">
  <defs>
    <linearGradient id="hg-bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1a2b"/>
      <stop offset="0.55" stop-color="#0a1c2a"/>
      <stop offset="1" stop-color="#050f18"/>
    </linearGradient>
    <radialGradient id="hg-portal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8bf6ff" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#22c2e6" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#0d6c8c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hg-gold" x1="32" y1="45" x2="224" y2="212" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6e0a6"/>
      <stop offset="0.5" stop-color="#ccae72"/>
      <stop offset="1" stop-color="#8a6c3b"/>
    </linearGradient>
    <linearGradient id="hg-h" x1="80" y1="80" x2="176" y2="176" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8e7b4"/>
      <stop offset="0.5" stop-color="#d4b878"/>
      <stop offset="1" stop-color="#9c7c46"/>
    </linearGradient>
    <linearGradient id="hg-core" x1="128" y1="84" x2="128" y2="172" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d8fbff"/>
      <stop offset="0.5" stop-color="#5ad9f4"/>
      <stop offset="1" stop-color="#19a6cc"/>
    </linearGradient>
    <linearGradient id="hg-gem" x1="128" y1="112" x2="128" y2="144" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#aef3ff"/>
      <stop offset="1" stop-color="#33c6ec"/>
    </linearGradient>
    <filter id="hg-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="hg-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- App-icon rounded square -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#hg-bg)" stroke="#1d3b51" stroke-width="2"/>

  <!-- Portal glow behind the gate -->
  <circle cx="128" cy="128" r="80" fill="url(#hg-portal)"/>

  <!-- Portal light beams pouring through the gate openings -->
  <g filter="url(#hg-soft)" opacity="0.55">
    <rect x="106" y="58" width="44" height="48" rx="10" fill="#5fe0f7"/>
    <rect x="106" y="150" width="44" height="48" rx="10" fill="#5fe0f7"/>
  </g>

  <!-- H as a gateway: gold pillars + crossbar -->
  <g>
    <rect x="80" y="78" width="26" height="100" rx="8" fill="url(#hg-h)" stroke="#6f562f" stroke-width="1.5"/>
    <rect x="150" y="78" width="26" height="100" rx="8" fill="url(#hg-h)" stroke="#6f562f" stroke-width="1.5"/>
    <rect x="98" y="115" width="60" height="26" rx="8" fill="url(#hg-h)" stroke="#6f562f" stroke-width="1.5"/>
  </g>

  <!-- Glowing hextech energy core inside the H -->
  <g filter="url(#hg-glow)">
    <rect x="88" y="86" width="10" height="84" rx="5" fill="url(#hg-core)"/>
    <rect x="158" y="86" width="10" height="84" rx="5" fill="url(#hg-core)"/>
    <rect x="98" y="123" width="60" height="10" rx="5" fill="url(#hg-core)"/>
  </g>

  <!-- Gateway core gem -->
  <g filter="url(#hg-glow)">
    <polygon points="128,112 142,128 128,144 114,128" fill="url(#hg-gem)"/>
    <polygon points="128,112 142,128 128,128 114,128" fill="#ffffff" opacity="0.55"/>
  </g>

  <!-- Finial gems on the pillars -->
  <g fill="#bff4ff">
    <circle cx="93" cy="78" r="4"/>
    <circle cx="163" cy="78" r="4"/>
    <circle cx="93" cy="178" r="4"/>
    <circle cx="163" cy="178" r="4"/>
  </g>
</svg>
